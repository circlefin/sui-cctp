[package]
name = "CctpExtensions"
edition = "2024.beta"
license = "Apache 2.0"

[addresses]
cctp_extensions = "0x0"

# `sui_extensions` is used only by this package's `#[test_only]` code
# (`rescuable.move`'s test module pulls in `sui_extensions::test_utils`).
# Declaring it as a production dependency is wrong and observably harmful: a
# release build never links it, so Sui prunes it from the published package's
# linkage table, and `sui client verify-source` then fails with "Source package
# depends on <sui_extensions> which is not in the linkage table". Same reasoning
# as TMM v2's `stablecoin` dev-dependency.
[dev-dependencies.sui_extensions]
local = "../../stablecoin-sui/packages/sui_extensions"

[dev-addresses]
