[package]
name = "TokenMessengerMinterV2"
edition = "2024.beta"
license = "Apache 2.0"

[dependencies.sui_extensions]
local = "../../stablecoin-sui/packages/sui_extensions"

[dependencies.MessageTransmitterV2]
local = "../message_transmitter_v2"

[dependencies.CctpExtensions]
local = "../cctp_extensions"

[addresses]
token_messenger_minter_v2 = "0x0"

# `stablecoin` is used only by TMM v2's `#[test_only]` modules
# (previously we referenced `stablecoin::treasury::{MintCap, Treasury}`
# from production code; that dependency is gone after the handler
# decoupling — TMM never touches Coin<T> now).
[dev-dependencies.stablecoin]
local = "../../stablecoin-sui/packages/stablecoin"

[dev-addresses]
